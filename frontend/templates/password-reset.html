<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab — Login</title>
        <link rel="icon" type="image/png" href="static/image/favicon.png">
    <meta name="description" content="Sign in to DataLab — your no-code data science platform.">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/datalab-ledger-theme.css">
</head>
<body>

<div class="auth-glow auth-glow-1"></div>
<div class="auth-glow auth-glow-2"></div>

<div class="auth-page">
    <div class="auth-card animate-in">
        <div class="auth-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 2h6"/>
                    <path d="M10 2v6.2a2 2 0 0 1-.4 1.2L4.7 16.8A2.5 2.5 0 0 0 6.7 20.5h10.6a2.5 2.5 0 0 0 2-4.2l-4.9-7.4a2 2 0 0 1-.4-1.2V2"/>
                    <path d="M7.5 14.5h9"/>
                </svg>
            </div>
            <h1 class="gradient-text">DATALAB</h1>
            <p>Change Password</p>
        </div>

        <form id="changePasswordForm" class="auth-form" autocomplete="on">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7"/>
                        </svg>
                    </span>
                    <input type="password" id="password" placeholder="Enter your new password" required autocomplete="password">
                    <button type="button" class="password-toggle" id="togglePwd" title="Show/hide password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="15" r="3.5"/>
                            <path d="M10.6 12.4 18 5"/>
                            <path d="M15.5 7.5 18 5l2.2 2.2"/>
                            <path d="M17 6 19 8"/>
                        </svg>
                    </span>
                    <input type="password" id="confirm-password" required autocomplete="confirm-password">
                    <button type="button" class="password-toggle" id="toggleConfirmPwd" title="Show/hide password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="message" class="msg-error"></p>

            <button type="submit" id="ChangeBtn" class="btn btn-primary btn-lg" style="width:100%;margin-top:4px;">
                <span id="ChangePassword">Change Password</span>
                <span id="ChangePasswordLoader" class="loader hidden"></span>
            </button>
        </form>

    </div>
</div>

<script>
    const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M6.6 6.7C4.3 8.2 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.2"/><path d="M17.7 17.4C20 15.9 22 12 22 12s-1.6-3.1-4.4-5.1A11.4 11.4 0 0 0 12 5c-.7 0-1.4.06-2 .18"/></svg>';

    function setupToggle(toggleId, inputId) {
        document.getElementById(toggleId).addEventListener('click', () => {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            toggle.innerHTML = isHidden ? eyeOffIcon : eyeIcon;
        });
    }

    setupToggle('togglePwd', 'password');
    setupToggle('toggleConfirmPwd', 'confirm-password');

    function resetButton() {
        document.getElementById('ChangeBtn').disabled = false;
        document.getElementById('ChangePassword').textContent = 'Change Password';
        document.getElementById('ChangePasswordLoader').classList.add('hidden');
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const token = new URLSearchParams(window.location.search).get('token');
        const passwordInput = document.getElementById('password').value;
        const confirmInput = document.getElementById('confirm-password').value;
        const messageEl = document.getElementById('message');
        const ChangeBtn = document.getElementById('ChangeBtn');

        messageEl.style.display = 'none';
        ChangeBtn.disabled = true;
        document.getElementById('ChangePassword').textContent = 'Changing password…';
        document.getElementById('ChangePasswordLoader').classList.remove('hidden');

        if (confirmInput !== passwordInput) {
            messageEl.className = 'msg-error';
            messageEl.textContent = '✗ Passwords do not match.';
            messageEl.style.display = 'flex';
            resetButton();  
            return;
        }

        try {
            const response = await fetch(`/auth/password-reset-verify?token=${token}`, {  
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_password: passwordInput, confirm_password: confirmInput }),
            });

            const result = await response.json();

            if (response.ok) {
                messageEl.className = 'msg-success';
                messageEl.textContent = '✓ ' + (result.message || 'Password changed! Redirecting…');
                messageEl.style.display = 'flex';
                setTimeout(() => window.location.href = '/login',1500);
            } else {
                messageEl.className = 'msg-error';
                messageEl.textContent = '✗ ' + (result.detail || 'Change failed. Please try again.');
                messageEl.style.display = 'flex';
                resetButton();
            }
        } catch {
            messageEl.className = 'msg-error';
            messageEl.textContent = '✗ Something went wrong. Please try again.';
            messageEl.style.display = 'flex';
            resetButton();
        }
    });
</script>
</body>
</html>
