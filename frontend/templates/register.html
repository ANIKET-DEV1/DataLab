<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab — Register</title>
    <meta name="description" content="Create your DataLab account and start exploring data.">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/datalab-ledger-theme.css">
</head>
<body class="register">

<div class="auth-glow auth-glow-1"></div>
<div class="auth-glow auth-glow-2"></div>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 2h6"/>
                    <path d="M10 2v6.2a2 2 0 0 1-.4 1.2L4.7 16.8A2.5 2.5 0 0 0 6.7 20.5h10.6a2.5 2.5 0 0 0 2-4.2l-4.9-7.4a2 2 0 0 1-.4-1.2V2"/>
                    <path d="M7.5 14.5h9"/>
                </svg>
            </div>
            <h1 class="gradient-text">Create Account</h1>
            <p>Join DataLab and start exploring your data</p>
        </div>

        <form id="Register_form" class="auth-form" autocomplete="on" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7"/>
                        </svg>
                    </span>
                    <input type="text" id="username" placeholder="Choose a username" required autocomplete="username" maxlength="15">
                </div>
                <p id="username-hint" class="field-hint">4–15 characters: letters, numbers and underscores only, no spaces.</p>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2.5"/>
                            <path d="m4 6.5 8 6 8-6"/>
                        </svg>
                    </span>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <p id="email-hint" class="field-hint">Enter a valid email address.</p>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="15" r="3.5"/>
                            <path d="M10.6 12.4 18 5"/>
                            <path d="M15.5 7.5 18 5l2.2 2.2"/>
                            <path d="M17 6 19 8"/>
                        </svg>
                    </span>
                    <input type="password" id="password" placeholder="8–16 characters" required autocomplete="new-password" maxlength="16">
                    <button type="button" class="password-toggle" id="togglePwd">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <p id="password-hint" class="field-hint">8–16 characters, with at least one letter, one number and one symbol.</p>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                            <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
                        </svg>
                    </span>
                    <input type="password" id="confirm_password" placeholder="Repeat your password" required autocomplete="new-password" maxlength="16">
                </div>
                <p id="confirm-hint" class="field-hint">Passwords do not match.</p>
            </div>

            <p id="message" class="msg-error"></p>

            <button type="submit" id="regBtn" class="btn btn-primary btn-lg" style="width:100%;">
                <span id="regBtnText">Create Account</span>
                <span id="regBtnLoader" class="loader hidden"></span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in →</a>
        </div>
    </div>
</div>

<script>
    // ── Format rules (mirrors the login page) ───────────────────
    // Username: trimmed, 4-15 chars, letters/numbers/underscore only, no spaces
    const USERNAME_REGEX = /^[A-Za-z0-9_]{4,15}$/;
    // Password: 8-16 chars, at least one letter, one digit, one symbol
    const PASSWORD_REGEX = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,16}$/;
    // Simple, permissive email check
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const usernameInputEl = document.getElementById('username');
    const emailInputEl = document.getElementById('email');
    const pwdInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');

    const usernameHint = document.getElementById('username-hint');
    const emailHint = document.getElementById('email-hint');
    const passwordHint = document.getElementById('password-hint');
    const confirmHint = document.getElementById('confirm-hint');

    const strengthFill = document.getElementById('strengthFill');

    function validateUsername(showState = true) {
        const trimmed = usernameInputEl.value.trim();
        const valid = USERNAME_REGEX.test(trimmed);
        if (showState) usernameHint.classList.toggle('field-error', !valid);
        return valid;
    }

    function validateEmail(showState = true) {
        const valid = EMAIL_REGEX.test(emailInputEl.value.trim());
        if (showState) emailHint.classList.toggle('field-error', !valid);
        return valid;
    }

    function validatePassword(showState = true) {
        const valid = PASSWORD_REGEX.test(pwdInput.value);
        if (showState) passwordHint.classList.toggle('field-error', !valid);
        return valid;
    }

    function validateConfirm(showState = true) {
        const valid = confirmInput.value.length > 0 && confirmInput.value === pwdInput.value;
        if (showState) confirmHint.classList.toggle('field-error', !valid);
        return valid;
    }

    // Strip spaces as the user types into username
    usernameInputEl.addEventListener('input', () => {
        if (/\s/.test(usernameInputEl.value)) {
            usernameInputEl.value = usernameInputEl.value.replace(/\s/g, '');
        }
        if (usernameHint.classList.contains('field-error')) validateUsername();
    });
    usernameInputEl.addEventListener('blur', () => {
        usernameInputEl.value = usernameInputEl.value.trim();
        validateUsername();
    });

    emailInputEl.addEventListener('input', () => {
        if (emailHint.classList.contains('field-error')) validateEmail();
    });
    emailInputEl.addEventListener('blur', () => validateEmail());

    // Password strength indicator + validation
    pwdInput.addEventListener('input', () => {
        const val = pwdInput.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const colors = ['#C1443B', '#D98E2B', '#2C5DA6', '#1F5D46'];
        const widths = ['25%', '50%', '75%', '100%'];
        if (val.length === 0) {
            strengthFill.style.width = '0%';
        } else {
            strengthFill.style.width = widths[score - 1] || '20%';
            strengthFill.style.background = colors[score - 1] || '#C1443B';
        }

        if (passwordHint.classList.contains('field-error')) validatePassword();
        if (confirmInput.value.length > 0) validateConfirm();
    });
    pwdInput.addEventListener('blur', () => validatePassword());

    confirmInput.addEventListener('input', () => {
        if (confirmHint.classList.contains('field-error')) validateConfirm();
    });
    confirmInput.addEventListener('blur', () => validateConfirm());

    // Password toggle
    const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M6.6 6.7C4.3 8.2 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.2"/><path d="M17.7 17.4C20 15.9 22 12 22 12s-1.6-3.1-4.4-5.1A11.4 11.4 0 0 0 12 5c-.7 0-1.4.06-2 .18"/></svg>';

    document.getElementById('togglePwd').addEventListener('click', () => {
        const pwd = document.getElementById('password');
        const toggle = document.getElementById('togglePwd');
        if (pwd.type === 'password') { pwd.type = 'text'; toggle.innerHTML = eyeOffIcon; }
        else { pwd.type = 'password'; toggle.innerHTML = eyeIcon; }
    });

    const form = document.querySelector('#Register_form');
    form.addEventListener('submit', async (evt) => {
        evt.preventDefault();

        const message = document.getElementById('message');
        const regBtn = document.getElementById('regBtn');
        const regBtnText = document.getElementById('regBtnText');
        const regBtnLoader = document.getElementById('regBtnLoader');

        message.style.display = 'none';
        message.textContent = '';

        // Trim username before validating/sending
        usernameInputEl.value = usernameInputEl.value.trim();

        const usernameValid = validateUsername();
        const emailValid = validateEmail();
        const passwordValid = validatePassword();
        const confirmValid = validateConfirm();

        if (!usernameValid || !emailValid || !passwordValid || !confirmValid) {
            message.className = 'msg-error';
            message.textContent = '✗ Please fix the highlighted fields before continuing.';
            message.style.display = 'flex';
            return;
        }

        const username = usernameInputEl.value;
        const email = emailInputEl.value.trim();
        const password = pwdInput.value;
        const confirm_password = confirmInput.value;

        regBtn.disabled = true;
        regBtnText.textContent = 'Creating account…';
        regBtnLoader.classList.remove('hidden');

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, confirm_password }),
                credentials: 'same-origin'
            });
            const result = await response.json();
            if (response.ok) {
                message.className = 'msg-success';
                message.textContent = '✓ Account created! Redirecting to login…';
                message.style.display = 'flex';
                setTimeout(() => window.location.href = '/login', 1200);
            } else {
                message.className = 'msg-error';
                message.textContent = '✗ ' + (result.detail || 'Registration failed.');
                message.style.display = 'flex';
                regBtn.disabled = false;
                regBtnText.textContent = 'Create Account';
                regBtnLoader.classList.add('hidden');
            }
        } catch {
            message.className = 'msg-error';
            message.textContent = '✗ Something went wrong. Please try again.';
            message.style.display = 'flex';
            regBtn.disabled = false;
            regBtnText.textContent = 'Create Account';
            regBtnLoader.classList.add('hidden');
        }
    });
</script>
</body>
</html>
