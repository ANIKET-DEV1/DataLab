<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 DataLab - Visualize</title>
    <!-- Include Free Chart.js Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 30px; }
        .vis-container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .control-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { background: #007bff; color: white; cursor: pointer; border: none; font-weight: bold;}
        button:hover { background: #0056b3; }
        .canvas-container { position: relative; margin-top: 20px; height: 400px; width: 100%; }
    </style>
</head>
<body>

<div class="vis-container">
    <h2>📊 No-Code Visualization Studio</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">

    <form id="visual-form" onsubmit="event.preventDefault(); renderChart();">
        <div class="control-row">
            <!-- 1. Select Chart Type -->
            <label>Chart Type:<br>
                <select id="chartType">
                    <option value="Bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="Hist">Histogram (Distribution)</option>
                    <option value="Scalar">Scatter Plot (Scalar)</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </label>

            <!-- 2. Target Columns (These can be dynamically populated using your dataset column array) -->
            <label>X-Axis (or Target Column):<br>
                <input type="text" id="xAxisCol" placeholder="e.g., age" required>
            </label>

            <label id="yAxisLabel">Y-Axis (Optional):<br>
                <input type="text" id="yAxisCol" placeholder="e.g., salary">
            </label>

            <label style="display: flex; align-items: flex-end;">
                <button type="submit">Generate Plot</button>
            </label>
        </div>
    </form>

    <!-- Canvas Frame where Chart.js draws elements dynamically -->
    <div class="canvas-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;
    
    // Assume this is passed globally from your dashboard selection context
    const currentDatasetId = "YOUR_ACTIVE_DATASET_UUID_STRING"; 

    // Hide or show Y-Axis fields conditionally based on chosen chart type
    document.getElementById('chartType').addEventListener('change', (e) => {
        const yField = document.getElementById('yAxisLabel');
        // Histograms and basic Pie counts don't explicitly require an initial secondary Y axis input
        yField.style.display = (e.target.value === 'Hist' || e.target.value === 'pie') ? 'none' : 'block';
    });

    async function renderChart() {
        const type = document.getElementById('chartType').value;
        const x = document.getElementById('xAxisCol').value;
        const y = document.getElementById('yAxisCol').value;

        // Fetch JSON data points from same-origin backend endpoint
        let url = `/api/v1/datasets/${currentDatasetId}/chart-data?chart_type=${type}&x_axis=${x}`;
        if (y) url += `&y_axis=${y}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Failed loading metrics.");

            const ctx = document.getElementById('myChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            let chartConfig = {
                type: type.toLowerCase() === 'scalar' ? 'scatter' : (type.toLowerCase() === 'hist' ? 'bar' : type.toLowerCase()),
                data: {},
                options: { responsive: true, maintainAspectRatio: false }
            };

            if (type === 'Scalar') {
                chartConfig.data = {
                    datasets: [{
                        label: `${x} vs ${y}`,
                        data: data.scatterData,
                        backgroundColor: '#007bff'
                    }]
                };
            } else {
                chartConfig.data = {
                    labels: data.labels,
                    datasets: [{
                        label: y ? `Mean ${y}` : 'Counts / Value Frequency',
                        data: data.values,
                        backgroundColor: type === 'pie' ? 
                            ['#007bff','#28a745','#ffc107','#dc3545','#6f42c1','#fd7e14','#20c997','#17a2b8'] : '#007bff',
                        borderWidth: 1
                    }]
                };
            }

            chartInstance = new Chart(ctx, chartConfig);

        } catch (err) {
            alert("Visualization Error: " + err.message);
        }
    }
</script>
</body>
</html>
