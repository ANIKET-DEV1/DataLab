<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab — Dashboard</title>
    <meta name="description" content="Manage and explore your datasets with DataLab.">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/datalab-ledger-theme.css">
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
    <a href="/" class="navbar-brand">
        <div class="brand-icon">🔬</div>
        <span class="brand-name">DataLab</span>
    </a>
    <div class="nav-links">
        <a href="/upload" class="nav-link"><i data-lucide="Upload" style="width:16px;color:#1F5D46;"></i> Upload</a>
        <a href="/preview" class="nav-link"><i data-lucide="ScanSearch" style="width:16px;color:#1F5D46;"></i> Preview</a>
        <a href="/visualize" class="nav-link"><i data-lucide="ChartSpline" style="width:16px;color:#1F5D46;"></i> Visualize</a>
        <a href="/clean" class="nav-link"><i data-lucide="BrushCleaning" style="width:16px;color:#1F5D46;"></i> Clean</a>
        <a href="/ml" class="nav-link"><i data-lucide="BrainCircuit" style="width:16px;color:#1F5D46;"></i> ML <span class="nav-badge">Soon</span></a>
    </div>
    <div class="nav-right">
        <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
    </div>
</nav>

<!-- ── Main Content ── -->
<main class="page-wrap">
    <div class="page-header animate-in">
        <p class="greeting">Good to see you, <span id="username">…</span> 👋</p>
        <h1>Your Datasets</h1>
        <p>Select a dataset to set it as active, then explore it across the tools.</p>
    </div>

    <div class="stats-row animate-in animate-in-delay-1" id="active-info" style="display:none;">
        <div class="active-badge">
            <span class="dot"></span>
            Active: <strong id="active-name-label" style="margin-left:4px;">—</strong>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="animate-in animate-in-delay-1">
        <div class="loader" style="width:32px;height:32px;border-width:3px;"></div>
        <p>Loading your datasets…</p>
    </div>

    <!-- Dataset Grid -->
    <div id="datasets" class="dataset-grid animate-in animate-in-delay-2"></div>
</main>

<script>
        lucide.createIcons();
</script>
<script src="/static/js/auth.js"></script>

<script src="/static/js/script.js"></script>
<script>
    // Show active dataset indicator
    const activeName = localStorage.getItem('active_name');
    if (activeName) {
        document.getElementById('active-name-label').textContent = activeName;
        document.getElementById('active-info').style.display = 'flex';
    }

</script>

</body>
</html>
