<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab — Login</title>
    <meta name="description" content="Sign in to DataLab — your no-code data science platform.">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .input-icon-wrap { position: relative; }
        .input-icon-wrap input { padding-left: 42px; }
        .input-icon-wrap .icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.5;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color var(--transition-fast);
        }
        .password-toggle:hover { color: var(--text-primary); }
        #message {
            display: none;
            min-height: 0;
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card animate-in">
        <div class="auth-header">
            <div class="brand-icon">🔬</div>
            <h1 class="gradient-text">Welcome back</h1>
            <p>Sign in to continue to DataLab</p>
        </div>

        <form id="loginForm" class="auth-form" autocomplete="on">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon-wrap">
                    <span class="icon">👤</span>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">🔑</span>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePwd" title="Show/hide password">👁️</button>
                </div>
            </div>

            <p id="message" class="msg-error"></p>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;margin-top:4px;">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnLoader" class="loader hidden"></span>
            </button>
        </form>

        <div class="auth-divider" style="margin-top:24px;">
            <span>Don't have an account?</span>
        </div>

        <div class="auth-footer">
            <a href="/register">Create an account →</a>
        </div>
    </div>
</div>

<script>
    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';

    // Password toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
        const pwd = document.getElementById('password');
        const toggle = document.getElementById('togglePwd');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            toggle.textContent = '🙈';
        } else {
            pwd.type = 'password';
            toggle.textContent = '👁️';
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const messageElement = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginBtnLoader = document.getElementById('loginBtnLoader');

        messageElement.style.display = 'none';
        loginBtn.disabled = true;
        loginBtnText.textContent = 'Signing in…';
        loginBtnLoader.classList.remove('hidden');

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput }),
                credentials: 'same-origin'
            });

            const result = await response.json();

            if (response.ok) {
                messageElement.className = 'msg-success';
                messageElement.textContent = '✓ ' + (result.message || 'Login successful! Redirecting…');
                messageElement.style.display = 'flex';
                setTimeout(() => window.location.href = '/datasets/view', 600);
            } else {
                messageElement.className = 'msg-error';
                messageElement.textContent = '✗ ' + (result.detail || 'Login failed. Check your credentials.');
                messageElement.style.display = 'flex';
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
                loginBtnLoader.classList.add('hidden');
            }
        } catch (error) {
            console.error('Error logging in:', error);
            messageElement.className = 'msg-error';
            messageElement.textContent = '✗ Something went wrong. Please try again.';
            messageElement.style.display = 'flex';
            loginBtn.disabled = false;
            loginBtnText.textContent = 'Sign In';
            loginBtnLoader.classList.add('hidden');
        }
    });
</script>
</body>
</html>
