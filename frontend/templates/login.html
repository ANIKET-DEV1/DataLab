<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab — Login</title>
        <link rel="icon" type="image/png" href="static/image/favicon.png">
    <meta name="description" content="Sign in to DataLab — your no-code data science platform.">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/datalab-ledger-theme.css">

</head>
<body>

<div class="auth-glow auth-glow-1"></div>
<div class="auth-glow auth-glow-2"></div>

<div class="auth-page">
    <div class="auth-card animate-in">
        <div class="auth-header">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 2h6"/>
                    <path d="M10 2v6.2a2 2 0 0 1-.4 1.2L4.7 16.8A2.5 2.5 0 0 0 6.7 20.5h10.6a2.5 2.5 0 0 0 2-4.2l-4.9-7.4a2 2 0 0 1-.4-1.2V2"/>
                    <path d="M7.5 14.5h9"/>
                </svg>
            </div>
            <h1 class="gradient-text">Welcome back</h1>
            <p>Sign in to continue to DataLab</p>
        </div>

        <form id="loginForm" class="auth-form" autocomplete="on" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7"/>
                        </svg>
                    </span>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" maxlength="15">
                </div>
                <p id="username-hint" class="field-hint">4–15 characters: letters, numbers and underscores only, no spaces.</p>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="15" r="3.5"/>
                            <path d="M10.6 12.4 18 5"/>
                            <path d="M15.5 7.5 18 5l2.2 2.2"/>
                            <path d="M17 6 19 8"/>
                        </svg>
                    </span>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" maxlength="16">
                    <button type="button" class="password-toggle" id="togglePwd" title="Show/hide password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p id="password-hint" class="field-hint">8–16 characters, with at least one letter, one number and one symbol.</p>
                <span><a href="/email-verify">Forgot password?</a></span>
            </div>

            <p id="message" class="msg-error"></p>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="width:100%;">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnLoader" class="loader hidden"></span>
            </button>
        </form>

        <div class="auth-divider">
            <span>Don't have an account?</span>
        </div>

        <div class="auth-footer">
            <a href="/register">Create an account →</a>
        </div>
    </div>
</div>

<script>
    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';

    
    const USERNAME_REGEX = /^[A-Za-z0-9_]{4,15}$/;

    const PASSWORD_REGEX = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,16}$/;

    const usernameInputEl = document.getElementById('username');
    const passwordInputEl = document.getElementById('password');
    const usernameHint = document.getElementById('username-hint');
    const passwordHint = document.getElementById('password-hint');

    function validateUsername(showState = true) {
        const trimmed = usernameInputEl.value.trim();
        const valid = USERNAME_REGEX.test(trimmed);
        if (showState) usernameHint.classList.toggle('field-error', !valid);
        return valid;
    }

    function validatePassword(showState = true) {
        const valid = PASSWORD_REGEX.test(passwordInputEl.value);
        if (showState) passwordHint.classList.toggle('field-error', !valid);
        return valid;
    }

    usernameInputEl.addEventListener('input', () => {
        if (/\s/.test(usernameInputEl.value)) {
            usernameInputEl.value = usernameInputEl.value.replace(/\s/g, '');
        }
        if (usernameHint.classList.contains('field-error')) validateUsername();
    });
    usernameInputEl.addEventListener('blur', () => {
        usernameInputEl.value = usernameInputEl.value.trim();
        validateUsername();
    });
    passwordInputEl.addEventListener('input', () => {
        if (passwordHint.classList.contains('field-error')) validatePassword();
    });
    passwordInputEl.addEventListener('blur', () => validatePassword());

    // Password toggle
    const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M6.6 6.7C4.3 8.2 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.2"/><path d="M17.7 17.4C20 15.9 22 12 22 12s-1.6-3.1-4.4-5.1A11.4 11.4 0 0 0 12 5c-.7 0-1.4.06-2 .18"/></svg>';

    document.getElementById('togglePwd').addEventListener('click', () => {
        const pwd = document.getElementById('password');
        const toggle = document.getElementById('togglePwd');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            toggle.innerHTML = eyeOffIcon;
        } else {
            pwd.type = 'password';
            toggle.innerHTML = eyeIcon;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const messageElement = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginBtnLoader = document.getElementById('loginBtnLoader');

        messageElement.style.display = 'none';
        messageElement.textContent = '';

        // Trim username before validating/sending
        usernameInputEl.value = usernameInputEl.value.trim();

        const usernameValid = validateUsername();
        const passwordValid = validatePassword();

        if (!usernameValid || !passwordValid) {
            messageElement.className = 'msg-error';
            messageElement.textContent = '✗ Please fix the highlighted fields before continuing.';
            messageElement.style.display = 'flex';
            return;
        }

        const usernameInput = usernameInputEl.value;
        const passwordInput = passwordInputEl.value;

        loginBtn.disabled = true;
        loginBtnText.textContent = 'Signing in…';
        loginBtnLoader.classList.remove('hidden');

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput }),
            });

            const result = await response.json();

            if (response.ok) {
                messageElement.className = 'msg-success';
                messageElement.textContent = '✓ ' + (result.message || 'Login successful! Redirecting…');
                messageElement.style.display = 'flex';
                setTimeout(() => window.location.href = '/datasets/view', 600);
            } else {
                messageElement.className = 'msg-error';
                messageElement.textContent = '✗ ' + (result.detail || 'Login failed. Check your credentials.');
                messageElement.style.display = 'flex';
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
                loginBtnLoader.classList.add('hidden');
            }
        } catch (error) {
            console.error('Error logging in:', error);
            messageElement.className = 'msg-error';
            messageElement.textContent = '✗ Something went wrong. Please try again.';
            messageElement.style.display = 'flex';
            loginBtn.disabled = false;
            loginBtnText.textContent = 'Sign In';
            loginBtnLoader.classList.add('hidden');
        }
    });
</script>
</body>
</html>
