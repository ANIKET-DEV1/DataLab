<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab</title>
 
</head>
<body style="margin: 0; padding: 0; background-color: #EEF0EA; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #181C1A;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #EEF0EA;">
        <tr>
            <td align="center" style="padding: 48px 16px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; background-color: #FBFAF6; border: 1px solid #D8DAD1; border-radius: 10px; overflow: hidden;">

                    <tr>
                        <td style="padding: 0; line-height: 0; font-size: 0;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
                                <tr>
                                    <td width="33.33%" height="3" style="background-color: #1F5D46; line-height: 3px; font-size: 0;">&nbsp;</td>
                                    <td width="33.33%" height="3" style="background-color: #2C5DA6; line-height: 3px; font-size: 0;">&nbsp;</td>
                                    <td width="33.34%" height="3" style="background-color: #D98E2B; line-height: 3px; font-size: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Wordmark -->
                    <tr>
                        <td style="padding: 32px 40px 24px 40px;">
                            <table border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="width: 34px; padding-right: 10px;">
                                        <div style="width: 32px; height: 32px; border-radius: 8px; background-color: #1F5D46; color: #FFFFFF; font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; line-height: 32px; text-align: center;">&#402;x</div>
                                    </td>
                                    <td style="font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; color: #181C1A; letter-spacing: -0.01em; vertical-align: middle;">DataLab</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 40px;">
                            <div style="border-top: 1px solid #E7E9E1;"></div>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 32px 40px 8px 40px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 28px 40px 32px 40px; border-top: 1px solid #E7E9E1;">
                            <p style="margin: 0; font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; color: #7A8177;">
                                This is an automated message from DataLab. If you weren't expecting it, you can safely ignore it.<br>
                                &copy; 2026 DataLab
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
