<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 — Too Many Requests | DataLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base:        #EEF0EA;
            --bg-card:        #FBFAF6;
            --border:         #D8DAD1;

            --accent:         #1F5D46;
            --accent-2:       #2C5DA6;
            --accent-glow:    rgba(31,93,70,0.20);

            --warning:        #D98E2B;
            --warning-glow:   rgba(217,142,43,0.20);

            --text-primary:   #181C1A;
            --text-secondary: #535B56;
            --text-muted:     #7A8177;

            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;

            --shadow-card: 0 4px 24px rgba(24,28,26,0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(24,28,26,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(24,28,26,0.05) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-card), 0 0 40px rgba(217,142,43,0.08);
            position: relative;
            overflow: hidden;
            z-index: 1;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--warning), var(--accent), var(--accent-2));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--warning-glow);
            border: 1px solid rgba(217,142,43,0.35);
            color: var(--warning);
            padding: 6px 14px;
            border-radius: 9999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: itemRise 0.5s ease 0.15s forwards, pulseGlow 2.6s ease-in-out 0.7s infinite;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3.6rem, 12vw, 6.5rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--warning) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -2px;
            opacity: 0;
            animation: itemRise 0.5s ease 0.22s forwards;
        }

        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.25rem, 4vw, 1.65rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            opacity: 0;
            animation: itemRise 0.5s ease 0.28s forwards;
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.65;
            margin-bottom: 2rem;
            opacity: 0;
            animation: itemRise 0.5s ease 0.34s forwards;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: itemRise 0.5s ease 0.4s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            border: none;
            flex: 1 1 auto;
            min-width: 150px;
        }

        .btn:active { transform: scale(0.97); }

        .btn-warning {
            background: var(--warning);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(217,142,43,0.3);
        }

        .btn-warning:hover {
            background: #B87621;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217,142,43,0.4);
        }

        .btn-secondary {
            background: #FFFFFF;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(24,28,26,0.04);
            border-color: rgba(24,28,26,0.18);
            transform: translateY(-2px);
        }

        @keyframes itemRise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(217,142,43,0); }
            50%      { box-shadow: 0 0 12px rgba(217,142,43,0.35); }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .error-card { padding: 2.25rem 1.5rem; border-radius: var(--radius-lg); }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-card, .badge, .error-code, .error-title, .error-desc, .actions {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .btn:hover, .btn:active { transform: none !important; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="badge">
            <i data-lucide="zap-off" style="width:15px;height:15px;"></i> Rate Limit Exceeded
        </div>
        <div class="error-code">429</div>
        <h1 class="error-title">Too Many Requests</h1>
        <p class="error-desc">
            {% if detail %}{{ detail }}{% else %}You have made too many requests in a short period. Please wait a minute before trying again.{% endif %}
        </p>
        <div class="actions">
            <button onclick="window.location.reload()" class="btn btn-warning">
                <i data-lucide="rotate-cw" style="width:18px;height:18px;"></i> Try Again
            </button>
            <a href="/" class="btn btn-secondary">
                <i data-lucide="house" style="width:18px;height:18px;"></i> Return Home
            </a>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
